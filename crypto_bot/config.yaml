mode: paper  # paper | live

exchange:
  name: okx
  testnet: true  # true for paper mode testnet
  api_key: ""
  secret: ""
  password: ""

trading:
  symbols:
    - BTC/USDT
    - ETH/USDT
  timeframe: 1h
  trend_timeframe: 4h

strategy:
  bb_period: 20
  bb_std: 2.0
  rsi_period: 14
  rsi_oversold: 35
  rsi_overbought: 55
  ema_period: 200
  atr_period: 14
  atr_stop_multiplier: 2.0
  volume_ratio_threshold: 1.2
  max_hold_hours: 72

risk:
  position_size_min: 0.10
  position_size_max: 0.20
  max_positions: 2
  daily_loss_limit: 0.05
  consecutive_stop_limit: 3
  cooldown_hours: 4
  min_usdt_ratio: 0.30
  slippage_max: 0.003
  extreme_volatility_threshold: 0.10

notify:
  telegram:
    enabled: false
    token: ""
    chat_id: ""
